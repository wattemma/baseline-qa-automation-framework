
name: Playwright Tests with Xray Sync

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Run Playwright tests
      run: npx playwright test --reporter=junit

    - name: Upload JUnit test results to Xray
      if: always()
      run: |
        curl -H "Content-Type: application/json" \
             -X POST \
             -d '{ "client_id": "${{ secrets.XRAY_CLIENT_ID }}", "client_secret": "${{ secrets.XRAY_CLIENT_SECRET }}" }' \
             https://xray.cloud.getxray.app/api/v2/authenticate > token.txt

        token=$(cat token.txt | tr -d '"')

        curl -H "Content-Type: multipart/form-data" \
             -H "Authorization: Bearer $token" \
             -F "results=@playwright-report/results.xml;type=application/xml" \
             https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=${{ secrets.XRAY_PROJECT_KEY }}
